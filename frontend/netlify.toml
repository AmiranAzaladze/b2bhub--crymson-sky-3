[build]
  base    = "frontend"
  command = "yarn install --frozen-lockfile && yarn build"
  publish = "build"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"

# Proxy /sitemap.xml and /robots.txt to the backend so each custom domain
# gets its own dynamic sitemap (resolved server-side from the Host header).
# IMPORTANT: these MUST come before the SPA fallback below.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "https://b2bhub-crymson-sky-3-production.up.railway.app/api/public/sitemap.xml"
  status = 200
  force  = true

[[redirects]]
  from   = "/robots.txt"
  to     = "https://b2bhub-crymson-sky-3-production.up.railway.app/api/public/robots.txt"
  status = 200
  force  = true

# Force www → non-www across every attached custom domain.
# Netlify's `*` wildcard greedily captures the rest of the URL (hostname + path),
# and `:splat` substitutes it back, so https://www.example.com/foo becomes
# https://example.com/foo for ALL attached custom domains in a single rule.
# Required by SEOptimer / Seobility audits to consolidate link equity to one canonical host.
[[redirects]]
  from   = "https://www.*"
  to     = "https://:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.*"
  to     = "https://:splat"
  status = 301
  force  = true

# SPA fallback — every path returns index.html so React Router can handle it
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-cache static assets, never-cache index.html
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
